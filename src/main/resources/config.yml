# 서버가 켜지면 자동으로 재해 게임을 시작할지 여부 (false면 /qd start 로 시작)
auto-start: false

# ───── 날짜 ─────
# 하루의 길이(초). 마인크래프트 하루 = 1200초(20분)
day-length-seconds: 1200
# 새 날이 시작될 때 월드 시간을 아침으로 맞출지 여부
sync-world-time: true

# 몇 일마다 자연재해가 바뀌는지 (1 = 매일 다른 재해)
disaster-change-days: 1

# 몇 일을 버티면 성공인지 (0 = 끝없이 진행)
survive-days: 10

# ───── 리스폰 ─────
respawn:
  # unlimited      : 죽어도 계속 리스폰
  # lives          : 목숨 개수만큼만 리스폰, 다 쓰면 탈락(관전)
  # after-disaster : 재해 중에 죽으면 관전하다가 그 재해가 끝나면 부활
  mode: lives
  # mode 가 lives 일 때 목숨 개수
  lives: 3
# 리스폰 모드가 unlimited 가 아닐 때, 모든 플레이어가 죽거나 탈락하면 게임 오버

# ───── 재해 진행 ─────
# 게임 시작 후 첫 재해까지 대기 시간(초)
first-delay-seconds: 15
# 재해가 한 번 끝나고 다시 올 때까지 쉬는 시간(초)
# 0 으로 하면 쉬지 않고 재해가 바뀔 때까지 계속 진행됩니다 (duration-seconds 무시)
interval-seconds: 45
# 재해 시작 전 경고 카운트다운(초)
warning-seconds: 5

# 재해가 처음 시작되거나 다른 재해로 바뀔 때 울리는 사이렌 (토네이도 경보 사이렌 스타일)
# 천천히 올라가고(rise) → 꼭대기에서 버티고(hold) → 길게 내려갑니다(fall). 20틱 = 1초
siren:
  # 사용할 소리. 여러 개를 목록으로 쓰면 겹쳐서 재생합니다. (리소스팩의 커스텀 소리도 가능)
  # /qd siren 으로 게임 안에서 바로 들어볼 수 있습니다. (설정을 바꿨으면 /qd reload 먼저)
  #
  # [B] 디저리두 + 플루트: 낮은 바탕 + 또렷한 사이렌 음 (기본)
  sound: [minecraft:block.note_block.didgeridoo, minecraft:block.note_block.flute]
  # [C] 플루트만: 덜 무겁고 더 사이렌다운 음 → 위 줄을 지우고 아래 줄의 # 을 지운 뒤 max-pitch 를 1.2 로
  # sound: minecraft:block.note_block.flute
  volume: 1.0
  # 음 높이 범위 (0.5 ~ 2.0, 낮을수록 어둡고 묵직함)
  min-pitch: 0.5
  max-pitch: 1.3
  rise-ticks: 60
  hold-ticks: 30
  fall-ticks: 100
  # 몇 번 반복할지
  cycles: 1
  # 소리를 몇 틱마다 한 번씩 낼지 (1 = 가장 촘촘하게 이어짐)
  interval-ticks: 1
  # 회전하는 경보기처럼 소리 크기가 흔들리는 정도(0 ~ 1)와 주기(틱)
  wobble: 0.4
  wobble-ticks: 24
  # 살짝 어긋난 음을 하나 더 겹쳐 불길하게 (1 또는 0 이면 끔, 1.06 = 반음 정도 높게)
  detune: 1.06

# Bedrock(Geyser + Floodgate) 플레이어 설정. Floodgate 가 없으면 무시됩니다.
bedrock:
  # 지진/토네이도가 Bedrock 플레이어를 밀어내는 세기 배율 (Bedrock 에서 덜컹거림 완화)
  knockback-multiplier: 0.7

# 재해가 블록을 부술 수 있는지 여부
block-damage: true

# 재해가 일어날 월드 목록 (비워두면 모든 월드)
worlds: []

# 전체 재해 세기 배율. 운석 수, 벼락 수, 부서지는 블록 수 같은 "양"에 곱해집니다.
# 0.5 = 절반, 1.0 = 기본, 2.0 = 두 배
intensity: 1.0

# 각 재해 설정. enabled: false 로 끄거나 duration-seconds 로 한 번의 지속 시간을 바꿀 수 있습니다.
# radius 는 플레이어 주변 몇 칸까지 영향을 주는지입니다.
disasters:
  meteor:
    enabled: true
    duration-seconds: 30
    meteors-per-second: 5
    # 플레이어 주변 몇 칸 범위에 떨어지는지 / 몇 칸 위에서 떨어지는지
    spread: 45
    height: 70
    explosion-power: 4.0
    # 거대 운석: 나올 확률과 폭발 세기 (파편과 불을 흩뿌림)
    giant-chance: 0.12
    giant-power: 9.0
  earthquake:
    enabled: true
    duration-seconds: 25
    # 지진은 월드 시드로 정해진 지각판의 경계에서 일어납니다. (/qd plate 로 확인)
    #   발산형: 땅이 벌어지며 깊게 갈라짐, 바닥에 용암
    #   수렴형: 땅이 솟아올라 능선이 생기고 바위가 굴러떨어짐, 가장 세게 흔들림
    #   보존형: 경계 건너편 땅이 옆으로 어긋남, 경계와 나란히 흔들림
    plates:
      # 판 하나의 대략적인 크기(블록). 클수록 판이 크고 경계가 드묾
      size: 600
      # 같은 시드에서 다른 판 지도를 원하면 바꾸세요
      salt: 0
    # 경계에서 이 거리(블록)만큼 멀어지면 가장 약하게 흔들림
    falloff: 200
    # 경계가 이 거리(블록) 안에 있을 때만 땅이 갈라지거나 솟거나 어긋남
    effect-range: 120
    # 발산형 균열 바닥에 용암/마그마
    rift-lava: true
    # 주변 흔들림: 반경과 0.25초마다 튀어오르는 지면 블록 수
    radius: 30
    blocks-per-burst: 6
  thunder_storm:
    enabled: true
    duration-seconds: 30
    radius: 35
    # 4초마다 한곳에 연달아 떨어지는 벼락 수
    barrage-strikes: 8
  acid_rain:
    enabled: true
    duration-seconds: 40
    damage-per-second: 1.5
    radius: 30
    # 0.2초마다 녹는 지면 블록 수 (나뭇잎·풀 사라짐, 잔디→흙, 돌→조약돌→자갈)
    corrode-per-burst: 8
  tornado:
    enabled: true
    duration-seconds: 40
    # 동시에 생기는 토네이도 수
    count: 2
    radius: 14
    height: 48
    # 1틱에 움직이는 칸 수
    speed: 0.3
    # 0.1초마다 뜯겨 올라가는 블록 수
    blocks-per-rip: 3
  blizzard:
    enabled: true
    duration-seconds: 40
    radius: 30
    # 0.15초마다 눈이 쌓이는 칸 수 (물은 얼음으로)
    snow-per-burst: 10
