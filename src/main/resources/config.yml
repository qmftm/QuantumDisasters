# 서버가 켜지면 자동으로 재해 게임을 시작할지 여부 (false면 /qd start 로 시작)
auto-start: false

# ───── 날짜 ─────
# 하루의 길이(초). 마인크래프트 하루 = 1200초(20분)
day-length-seconds: 1200
# 새 날이 시작될 때 월드 시간을 아침으로 맞출지 여부
sync-world-time: true

# 몇 일마다 자연재해가 바뀌는지 (1 = 매일 다른 재해)
disaster-change-days: 1

# 몇 일을 버티면 성공인지 (0 = 끝없이 진행)
survive-days: 10

# ───── 리스폰 ─────
respawn:
  # unlimited      : 죽어도 계속 리스폰
  # lives          : 목숨 개수만큼만 리스폰, 다 쓰면 탈락(관전)
  # after-disaster : 재해 중에 죽으면 관전하다가 그 재해가 끝나면 부활
  mode: lives
  # mode 가 lives 일 때 목숨 개수
  lives: 3
# 리스폰 모드가 unlimited 가 아닐 때, 모든 플레이어가 죽거나 탈락하면 게임 오버

# ───── 재해 진행 ─────
# 게임 시작 후 첫 재해까지 대기 시간(초)
first-delay-seconds: 15
# 재해가 한 번 끝나고 다시 올 때까지 쉬는 시간(초)
# 0 으로 하면 쉬지 않고 재해가 바뀔 때까지 계속 진행됩니다 (duration-seconds 무시)
interval-seconds: 45
# 재해 시작 전 경고 카운트다운(초)
warning-seconds: 5

# 재해가 처음 시작되거나 다른 재해로 바뀔 때 울리는 사이렌 (토네이도 경보 사이렌 스타일)
# 천천히 올라가고(rise) → 꼭대기에서 버티고(hold) → 길게 내려갑니다(fall). 20틱 = 1초
siren:
  # 사용할 소리. 여러 개를 목록으로 쓰면 겹쳐서 재생합니다. (리소스팩의 커스텀 소리도 가능)
  # /qd siren 으로 게임 안에서 바로 들어볼 수 있습니다. (설정을 바꿨으면 /qd reload 먼저)
  #
  # [B] 디저리두 + 플루트: 낮은 바탕 + 또렷한 사이렌 음 (기본)
  sound: [minecraft:block.note_block.didgeridoo, minecraft:block.note_block.flute]
  # [C] 플루트만: 덜 무겁고 더 사이렌다운 음 → 위 줄을 지우고 아래 줄의 # 을 지운 뒤 max-pitch 를 1.2 로
  # sound: minecraft:block.note_block.flute
  volume: 1.0
  # 음 높이 범위 (0.5 ~ 2.0, 낮을수록 어둡고 묵직함)
  min-pitch: 0.5
  max-pitch: 1.3
  rise-ticks: 60
  hold-ticks: 30
  fall-ticks: 100
  # 몇 번 반복할지
  cycles: 1
  # 소리를 몇 틱마다 한 번씩 낼지 (1 = 가장 촘촘하게 이어짐)
  interval-ticks: 1
  # 회전하는 경보기처럼 소리 크기가 흔들리는 정도(0 ~ 1)와 주기(틱)
  wobble: 0.4
  wobble-ticks: 24
  # 살짝 어긋난 음을 하나 더 겹쳐 불길하게 (1 또는 0 이면 끔, 1.06 = 반음 정도 높게)
  detune: 1.06

# 방사선 (태양 입자 폭풍)
radiation:
  # 피폭량(mSv)이 1분에 줄어드는 양. 아주 천천히 회복됩니다.
  recovery-per-minute: 1.0
  # 죽으면 피폭량을 0 으로 (false 면 죽어도 유지 → 매우 어려움)
  reset-on-death: true
  # 피폭량(mSv)에 따른 증상
  stages:
    hunger: 100      # 허기
    weakness: 250    # 나약함
    sickness: 500    # 채굴 피로 + 가끔 메스꺼움
    damage: 800      # 5초마다 반 칸 피해
    lethal: 1200     # 3초마다 한 칸 피해 + 시듦
  geiger-counter:
    # 겉모습으로 쓸 아이템
    item: minecraft:clock
    # 딸깍 소리
    click-sound: minecraft:block.note_block.hat
    click-volume: 0.6
    # 평소(방사선 없을 때) 1초에 딸깍이는 횟수
    background-clicks: 0.5
    # 선량률 1 mSv/초 당 1초에 딸깍이는 횟수 (최대 40)
    clicks-per-msv: 8
    # 제작법 (나중에 GUI 로 바꿀 수 있게 설정으로 둡니다. 바꾼 뒤 /qd reload)
    recipe:
      enabled: true
      # 제작법 책에 자동으로 보이게
      discover: true
      shape:
        - " R "
        - "CGC"
        - "CIC"
      ingredients:
        R: minecraft:redstone
        C: minecraft:copper_ingot
        G: minecraft:glass_pane
        I: minecraft:iron_ingot

# Bedrock(Geyser + Floodgate) 플레이어 설정. Floodgate 가 없으면 무시됩니다.
bedrock:
  # 지진/토네이도가 Bedrock 플레이어를 밀어내는 세기 배율 (Bedrock 에서 덜컹거림 완화)
  knockback-multiplier: 0.7

# 재해가 블록을 부술 수 있는지 여부
block-damage: true

# 재해가 일어날 월드 목록 (비워두면 모든 월드)
worlds: []

# 전체 재해 세기 배율. 운석 수, 벼락 수, 부서지는 블록 수 같은 "양"에 곱해집니다.
# 0.5 = 절반, 1.0 = 기본, 2.0 = 두 배
intensity: 1.0

# 각 재해 설정. enabled: false 로 끄거나 duration-seconds 로 한 번의 지속 시간을 바꿀 수 있습니다.
# radius 는 플레이어 주변 몇 칸까지 영향을 주는지입니다.
disasters:
  meteor:
    enabled: true
    duration-seconds: 30
    meteors-per-second: 5
    # 플레이어 주변 몇 칸 범위에 떨어지는지 / 몇 칸 위에서 떨어지는지
    spread: 45
    height: 70
    explosion-power: 4.0
    # 거대 운석: 나올 확률과 폭발 세기 (파편과 불을 흩뿌림)
    giant-chance: 0.12
    giant-power: 9.0
  earthquake:
    enabled: true
    duration-seconds: 25
    # 지진은 월드 시드로 정해진 지각판의 경계에서 일어납니다. (/qd plate 로 확인)
    #   발산형: 땅이 벌어지며 깊게 갈라짐, 바닥에 용암
    #   수렴형: 땅이 솟아올라 능선이 생기고 바위가 굴러떨어짐, 가장 세게 흔들림
    #   보존형: 경계 건너편 땅이 옆으로 어긋남, 경계와 나란히 흔들림
    plates:
      # 판 하나의 대략적인 크기(블록). 클수록 판이 크고 경계가 드묾
      size: 600
      # 같은 시드에서 다른 판 지도를 원하면 바꾸세요
      salt: 0
    # 경계에서 이 거리(블록)만큼 멀어지면 가장 약하게 흔들림
    falloff: 200
    # 경계가 이 거리(블록) 안에 있을 때만 땅이 갈라지거나 솟거나 어긋남
    effect-range: 120
    # 발산형 균열 바닥에 용암/마그마
    rift-lava: true
    # 주변 흔들림: 반경과 0.25초마다 튀어오르는 지면 블록 수
    radius: 30
    blocks-per-burst: 6
  thunder_storm:
    enabled: true
    duration-seconds: 30
    radius: 35
    # 4초마다 한곳에 연달아 떨어지는 벼락 수
    barrage-strikes: 8
  acid_rain:
    enabled: true
    duration-seconds: 40
    damage-per-second: 1.5
    radius: 30
    # 0.2초마다 녹는 지면 블록 수 (나뭇잎·풀 사라짐, 잔디→흙, 돌→조약돌→자갈)
    corrode-per-burst: 8
  tornado:
    enabled: true
    duration-seconds: 40
    # 동시에 생기는 토네이도 수
    count: 2
    radius: 14
    height: 48
    # 1틱에 움직이는 칸 수
    speed: 0.3
    # 0.1초마다 뜯겨 올라가는 블록 수
    blocks-per-rip: 3
  solar_storm:
    enabled: true
    # 태양 입자 폭풍: 방사선이 치솟았다가 천천히 줄어듭니다. 남은 시간은 보여주지 않고,
    # 방사선이 safe-rate 아래로 내려가면 끝납니다. (duration-seconds 는 쓰지 않음)
    # 하늘이 뚫린 지표면에서의 최고 선량률 (mSv/초)
    peak-rate: 5.0
    # 방사선이 절반으로 줄어드는 시간(초). 매번 이 사이에서 무작위
    half-life-min-seconds: 60
    half-life-max-seconds: 180
    # 10초마다 방사선이 다시 치솟을 확률
    spike-chance: 0.2
    # 이 선량률(mSv/초) 아래로 내려가면 끝
    safe-rate: 0.05
    # 아무리 길어도 이 시간(초)이 지나면 끝
    max-duration-seconds: 900
  flash_flood:
    enabled: true
    duration-seconds: 45
    # 플레이어 주변 몇 칸까지 물이 차오르는지
    radius: 26
    # 처음 높이보다 최대 몇 칸까지 차오르는지
    max-rise: 7
    # 0.1초마다 물을 채우는 칸 수 (클수록 빨리 차오름)
    columns-per-tick: 140
    # 물살이 떠미는 세기
    current-strength: 0.12
    # 끝나면 물이 빠질지 (false 면 그대로 남음)
    drain: true
  wildfire:
    enabled: true
    duration-seconds: 50
    # 플레이어에게서 최대 몇 칸 떨어진 곳에 불이 나는지
    radius: 40
    # 3초마다 새로 불이 나는 곳 수
    ignitions: 3
    # 불이 옆으로 번질 확률
    spread-chance: 0.35
    # 불 하나가 타는 시간(틱). 끝나면 주변 나무·잎·풀이 타 없어짐
    burn-ticks: 100
    # 동시에 탈 수 있는 최대 불 개수 (서버 부하 제한)
    max-fires: 600
  tsunami:
    enabled: true
    # 쓰나미: 남은 시간은 보여주지 않고 마지막 파도가 지나가면 끝 (duration-seconds 는 쓰지 않음)
    # 파도 수와 간격
    waves: 2
    first-wave-delay-seconds: 8
    seconds-between-waves: 25
    # 파도 높이(해수면 또는 플레이어 높이 기준), 폭, 속도(1틱에 몇 칸)
    height: 12
    width: 90
    speed: 0.55
    # 플레이어보다 몇 칸 먼 곳에서 시작해, 지나서 몇 칸 더 가는지
    start-distance: 70
    travel-beyond: 70
    # 휩쓸리는 세기
    push: 0.9
  avalanche:
    enabled: true
    duration-seconds: 40
    # 플레이어 주변 몇 칸 안에서 높은 곳을 찾는지
    search-radius: 50
    # 몇 초마다 눈사태가 나는지 / 한 번에 몇 초 동안 쏟아지는지
    seconds-between-slides: 9
    slide-seconds: 5
    # 1틱에 쏟아지는 눈 덩어리 수, 눈사태 폭, 가루눈(빠지면 얼어붙음) 비율
    blocks-per-tick: 6
    width: 14
    powder-snow-chance: 0.3
  sandstorm:
    enabled: true
    duration-seconds: 45
    radius: 30
    # 바람에 떠밀리는 세기
    wind-strength: 0.09
    # 바깥에 있으면 앞이 안 보이게 (실명 효과)
    blind: true
    # 투구 없이 바깥에 있으면 3초마다 받는 피해
    damage: 1.0
    # 0.15초마다 모래로 바뀌는 지면 수
    blocks-per-burst: 8
  blizzard:
    enabled: true
    duration-seconds: 40
    radius: 30
    # 0.15초마다 눈이 쌓이는 칸 수 (물은 얼음으로)
    snow-per-burst: 10
